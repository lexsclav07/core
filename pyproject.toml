[project]
name = "core-assistant"
version = "0.1.0"
description = "CORE: a local AI assistant for Fedora that lives in the terminal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "textual>=3.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-bash>=0.25.1",
]

[project.scripts]
core = "core.app:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
    "textual-dev>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
# SIM905 wants word lists as one-per-line literals; "a b c".split() reads better here.
ignore = ["SIM905"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Blocking file reads are fine inside async tests.
"tests/*" = ["ASYNC"]
# The task table reads better with one long regex per line.
"evals/tasks.py" = ["E501"]

[project]
name = "handsigns"
version = "0.1.0"
description = "Name hand signs from a webcam (peace, thumbs up, ...) with MediaPipe. From CORE's gesture mode."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=1.0.1",
]

[project.scripts]
handsigns = "handsigns.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["handsigns"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# MediaPipe ships no type hints.
module = ["mediapipe", "mediapipe.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
